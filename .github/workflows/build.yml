name: Build

# - Pull requests:       unit tests + debug APK (never signed, no secrets used)
# - Push to main:        unit tests + signed release APK and AAB (workflow artifacts)
# - Tag v* (e.g. v1.2.0): the above + a GitHub Release with the APK and the AAB for Google Play
#
# Required repository secrets for signed builds:
#   KEYSTORE_BASE64    base64 of the release .jks/.keystore
#   KEYSTORE_PASSWORD  keystore password
#   KEY_ALIAS          key alias
#   KEY_PASSWORD       key password

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Resolve version and signing mode
        run: |
          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi
          if [[ "${{ github.event_name }}" != "pull_request" && -n "$KEYSTORE_BASE64" ]]; then
            echo "SIGNED=true" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::Release tag pushed but signing secrets are missing."
            exit 1
          fi

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Decode keystore
        if: env.SIGNED == 'true'
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release (APK + AAB)
        if: env.SIGNED == 'true'
        run: ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Build debug APK
        if: env.SIGNED != 'true'
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Collect outputs
        run: |
          mkdir -p dist
          if [[ "$SIGNED" == "true" ]]; then
            V="${VERSION_NAME:-build-${{ github.run_number }}}"
            cp app/build/outputs/apk/release/app-release.apk "dist/Caffeine-$V.apk"
            cp app/build/outputs/bundle/release/app-release.aab "dist/Caffeine-$V.aab"
          else
            cp app/build/outputs/apk/debug/app-debug.apk "dist/Caffeine-debug-${{ github.run_number }}.apk"
          fi
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: caffeine-${{ env.SIGNED == 'true' && 'release' || 'debug' }}-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: caffeine-release-*
          merge-multiple: true
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FLAGS=""
          [[ "$GITHUB_REF_NAME" == *-* ]] && FLAGS="--prerelease"
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Caffeine ${GITHUB_REF_NAME#v}" \
            --generate-notes --verify-tag $FLAGS
